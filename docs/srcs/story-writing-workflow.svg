<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">STORY master's and doctoral thesis workflow</title>
  <desc id="desc">Research evidence flows through synthesis and chapter writing to examination, defense, and deposit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd86b"/></marker>
    <style>
      .bg{fill:#0a0f1e}
      .box{fill:rgba(255,255,255,0.045);stroke:rgba(148,163,216,0.35);stroke-width:1.5}
      .h{font:700 23px system-ui,sans-serif;fill:#e6eaf6}
      .s{font:16px system-ui,sans-serif;fill:#9aa5c4}
      .a{stroke:#ffd86b;stroke-width:3;marker-end:url(#arrow)}
      .star{fill:#e6eaf6}
    </style>
  </defs>
  <rect class="bg" width="1200" height="300"/>
  <g opacity="0.5">
    <circle class="star" cx="80" cy="40" r="1.4" opacity="0.5"/>
    <circle class="star" cx="320" cy="26" r="1" opacity="0.35"/>
    <circle class="star" cx="640" cy="44" r="1.3" opacity="0.45"/>
    <circle class="star" cx="960" cy="30" r="1" opacity="0.35"/>
    <circle class="star" cx="1130" cy="52" r="1.5" opacity="0.5"/>
    <circle class="star" cx="180" cy="264" r="1.1" opacity="0.4"/>
    <circle class="star" cx="520" cy="272" r="1.4" opacity="0.5"/>
    <circle class="star" cx="880" cy="266" r="1" opacity="0.35"/>
    <circle class="star" cx="1100" cy="258" r="1.2" opacity="0.4"/>
  </g>
  <line class="a" x1="243" y1="150" x2="277" y2="150"/>
  <line class="a" x1="543" y1="150" x2="577" y2="150"/>
  <line class="a" x1="843" y1="150" x2="877" y2="150"/>
  <g transform="translate(35 80)">
    <rect class="box" width="208" height="140" rx="14"/>
    <rect x="24" y="26" width="34" height="4" rx="2" fill="#4cc3ff"/>
    <text class="h" x="104" y="66" text-anchor="middle">Evidence</text>
    <text class="s" x="104" y="96" text-anchor="middle">STAR · STAGE · manual</text>
    <text class="s" x="104" y="120" text-anchor="middle">fingerprinted in mates/</text>
  </g>
  <g transform="translate(285 80)">
    <rect class="box" width="258" height="140" rx="14"/>
    <rect x="24" y="26" width="34" height="4" rx="2" fill="#8b93ff"/>
    <text class="h" x="129" y="66" text-anchor="middle">Synthesis</text>
    <text class="s" x="129" y="96" text-anchor="middle">story · contributions</text>
    <text class="s" x="129" y="120" text-anchor="middle">publications · claims</text>
  </g>
  <g transform="translate(585 80)">
    <rect class="box" width="258" height="140" rx="14"/>
    <rect x="24" y="26" width="34" height="4" rx="2" fill="#ffd86b"/>
    <text class="h" x="129" y="66" text-anchor="middle">Degree thesis</text>
    <text class="s" x="129" y="96" text-anchor="middle">chapters · figures · tables</text>
    <text class="s" x="129" y="120" text-anchor="middle">build · audit · revision</text>
  </g>
  <g transform="translate(885 80)">
    <rect class="box" width="280" height="140" rx="14"/>
    <rect x="24" y="26" width="34" height="4" rx="2" fill="#3ee6c0"/>
    <text class="h" x="140" y="66" text-anchor="middle">Degree</text>
    <text class="s" x="140" y="96" text-anchor="middle">examination · defense</text>
    <text class="s" x="140" y="120" text-anchor="middle">corrections · deposit</text>
  </g>
</svg>
